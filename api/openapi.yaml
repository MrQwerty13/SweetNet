openapi: 3.1.0
info:
  title: SweetNet API
  version: 1.0.0
  description: "One private circle. All active members see all posts, including
    historical posts. Private responses use Cache-Control: no-store. Passwords:
    Argon2id; sessions: opaque HttpOnly cookie for 30 days. No public media,
    email, roles input or public registration. Mutations require exact Origin."
