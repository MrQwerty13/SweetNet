name: sweetnet

x-app: &app
  image: ${SWEETNET_IMAGE:-sweetnet:local}
  build: .
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
  environment: &app-env
    DATABASE_URL: "postgres://${POSTGRES_USER:-sweetnet}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the explicit env file}@db:5432/${POSTGRES_DB:-sweetnet}?sslmode=disable"
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    APP_ENV: ${APP_ENV:-development}
    HTTP_ADDR: ":8080"
    UPLOAD_DIR: /data/uploads
    WEB_DIR: /app/web
  volumes:
    - uploads:/data/uploads

services:
  db:
    image: postgres:17.11-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweetnet}
      POSTGRES_DB: ${POSTGRES_DB:-sweetnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the explicit env file}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *app
    command: [/app/admin, migrate]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  app:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/readyz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

volumes:
  postgres_data:
  uploads:
