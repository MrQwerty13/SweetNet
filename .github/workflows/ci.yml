name: SweetNet checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sweetnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_USER: sweetnet_test
          POSTGRES_DB: sweetnet_test
          # Disposable CI service only; never an application account.
          POSTGRES_PASSWORD: ci_database_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweetnet_test -d sweetnet_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://sweetnet_test:ci_database_only@127.0.0.1:5432/sweetnet_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '26.0.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/package-lock.json
      - run: make deps
      - run: make format-check
      - run: cd backend && go vet ./... && go test -race -count=1 ./...
      - run: npm run lint --prefix web
      - run: make build contract maintenance
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: node tests/run-e2e.mjs
      - run: git diff --exit-code
  containers-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.0.0'
      - run: node tests/verify-compose.mjs
