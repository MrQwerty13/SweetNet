components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sweetnet_session
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
          required:
            - code
            - message
      required:
        - error
    Username:
      type: string
      pattern: ^[a-zA-Z0-9_]{3,32}$
    Password:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
    DisplayName:
      type: string
      minLength: 1
      maxLength: 80
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        role:
          type: string
          enum:
            - owner
            - member
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        - id
        - username
        - display_name
        - role
        - is_active
        - created_at
    Author:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          $ref: "#/components/schemas/DisplayName"
      required:
        - id
        - username
        - display_name
    Image:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          pattern: ^/api/v1/media/
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
      required:
        - id
        - url
        - width
        - height
    Post:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/Author"
        body:
          type: string
          maxLength: 5000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        images:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/Image"
      required:
        - id
        - author
        - body
        - created_at
        - updated_at
        - images
    Feed:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
    Invite:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_at:
          type:
            - string
            - "null"
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - created_at
        - expires_at
        - used_at
        - revoked_at
    CreatedInvite:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_at:
          type:
            - string
            - "null"
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        url:
          type: string
          format: uri
      required:
        - id
        - created_at
        - expires_at
        - used_at
        - revoked_at
        - url
    Register:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
        username:
          $ref: "#/components/schemas/Username"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        password:
          $ref: "#/components/schemas/Password"
      required:
        - token
        - username
        - display_name
        - password
    Login:
      type: object
      additionalProperties: false
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
      required:
        - username
        - password
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          $ref: "#/components/schemas/DisplayName"
      required:
        - display_name
    PasswordUpdate:
      type: object
      additionalProperties: false
      properties:
        current_password:
          $ref: "#/components/schemas/Password"
        new_password:
          $ref: "#/components/schemas/Password"
      required:
        - current_password
        - new_password
    ActiveUpdate:
      type: object
      additionalProperties: false
      properties:
        is_active:
          type: boolean
      required:
        - is_active
    PostUpdate:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
          maxLength: 5000
      required:
        - body
    PostCreate:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
          maxLength: 5000
        images:
          type: array
          maxItems: 4
          items:
            type: string
            format: binary
      required: []
    Users:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required:
        - items
    Invites:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Invite"
      required:
        - items
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
      required:
        - status
