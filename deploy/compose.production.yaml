# Opt in: docker compose --env-file .env.production -f compose.yaml
#        -f deploy/compose.production.yaml -p sweetnet-production up -d --build
services:
  app:
    environment:
      APP_ENV: production
      APP_ORIGIN: https://${SWEETNET_DOMAIN:?Set SWEETNET_DOMAIN}
  migrate:
    environment:
      APP_ENV: production
      APP_ORIGIN: https://${SWEETNET_DOMAIN:?Set SWEETNET_DOMAIN}
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      SWEETNET_DOMAIN: ${SWEETNET_DOMAIN:?Set SWEETNET_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
